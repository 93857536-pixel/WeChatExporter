name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Prepare app icon
        run: bash scripts/prepare_icon.sh

      - name: Build app with bundled wx-cli (x86_64 + arm64)
        run: ./build_app.sh

      - name: Verify universal binary
        run: lipo -archs WeChatExporter.app/Contents/MacOS/WeChatExporter | grep -q x86_64 && lipo -archs WeChatExporter.app/Contents/MacOS/WeChatExporter | grep -q arm64

      - name: Create DMG installer
        run: |
          python3 -m pip install --quiet Pillow || true
          bash scripts/create_dmg.sh WeChatExporter-macOS-universal.dmg

      - name: Create zip
        run: ditto -c -k --sequesterRsrc --keepParent WeChatExporter.app WeChatExporter-macOS-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            WeChatExporter-macOS-universal.dmg
            WeChatExporter-macOS-universal.zip

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build app with bundled wx-cli
        shell: pwsh
        run: |
          Set-Location windows
          ./build.ps1 -SelfContained

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path windows/dist/WeChatExporter/* `
            -DestinationPath WeChatExporter-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: WeChatExporter-Windows-x64.zip

  build-linux:
    name: Build Linux (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux/src-tauri

      - name: Run unit tests
        working-directory: linux/src-tauri
        run: cargo test

      - name: Build Tauri app (deb)
        working-directory: linux/src-tauri
        run: cargo tauri build --bundles deb

      - name: Create zip
        run: |
          zip -r WeChatExporter-Linux-x86_64.deb.zip \
            linux/src-tauri/target/release/bundle/deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: WeChatExporter-Linux-x86_64.deb.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
