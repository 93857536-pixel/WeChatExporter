name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        run: swift build -c release

      - name: Prepare icon and build app bundle
        run: |
          bash scripts/prepare_icon.sh
          ./build_app.sh

      - name: Verify bundled wx-cli (universal, WeChat 4.1.7+)
        run: |
          test -x WeChatExporter.app/Contents/Resources/wx-cli
          # #41：内置 wx-cli 必须是 universal（Intel + Apple Silicon 双切片）
          lipo -archs WeChatExporter.app/Contents/Resources/wx-cli | grep -q x86_64
          lipo -archs WeChatExporter.app/Contents/Resources/wx-cli | grep -q arm64
          WeChatExporter.app/Contents/Resources/wx-cli --version
          WeChatExporter.app/Contents/Resources/wx-cli doctor | tee /tmp/doctor.txt
          grep -q "All checks passed" /tmp/doctor.txt
          # 上游已移除固定版本 allowlist，改为「4.1.7 及以上均可提取密钥」：
          # 关键版本号字面量仍应出现在二进制中（4.1.7 最低门槛）
          strings WeChatExporter.app/Contents/Resources/wx-cli | grep -F '4.1.7' >/dev/null

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet build
        run: dotnet build windows/WeChatExporter.Windows/WeChatExporter.Windows.csproj -c Release
      - name: Bundle vendored wx.exe via build.ps1 dry path
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "wxe-cli-test"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./windows/scripts/bundle_wx_cli.ps1 -DestDir $out
          if (-not (Test-Path (Join-Path $out "wx.exe"))) { throw "wx.exe missing" }
          Write-Host "wx.exe OK:" (Get-Item (Join-Path $out "wx.exe")).Length

  build-linux:
    name: Linux (Tauri + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux/src-tauri

      - name: cargo check + test
        working-directory: linux/src-tauri
        run: |
          cargo check --all-targets
          cargo test
