[package]
name = "wechat-exporter-linux"
version = "2.19.0"
description = "WeChatExporter Linux 端：Tauri v2 + Rust 核心，导出已解密微信 SQLite 数据"
authors = ["linminhao"]
edition = "2021"
license = "MIT"
default-run = "wechat-exporter-linux"

# 库目标：供集成测试直接调用核心导出引擎
[lib]
name = "wechat_exporter_core"
path = "src/lib.rs"

# 可执行目标：GUI + 无头 wce CLI
[[bin]]
name = "wechat-exporter-linux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite（bundled：编译期内置 SQLite，跨平台零系统依赖；FTS5 随 bundled 默认开启，缺失时自动降级）
rusqlite = { version = "0.32", features = ["bundled"] }

# 算法基础（与 macOS/Windows 端字节互通）
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# 时间（Asia/Shanghai 固定 +8，无夏令时）
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
